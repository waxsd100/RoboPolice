# Builds Dockerfile.imagegen into Artifact Registry (docs/deploy/cloud-run-imagegen.md):
#   gcloud builds submit --config=infra/cloudbuild/imagegen.yaml --substitutions=_IMAGE=<registry path> .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'Dockerfile.imagegen', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
