services:
  sokudan:
    build:
      context: .
      dockerfile: Dockerfile.sokudan
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SOKUDAN_HOST: 0.0.0.0
      SOKUDAN_PORT: "8000"
      SOKUDAN_BACKEND: auto
      SOKUDAN_DEVICE: auto
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SOKUDAN_URL: http://sokudan:8000
    depends_on:
      sokudan:
        condition: service_healthy
