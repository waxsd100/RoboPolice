services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-logger}
      POSTGRES_USER: ${PGUSER:-postgresusername}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgrespassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  sokudan:
    build:
      context: .
      dockerfile: Dockerfile.sokudan
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SOKUDAN_HOST: 0.0.0.0
      SOKUDAN_PORT: "8000"
      SOKUDAN_BACKEND: auto
      SOKUDAN_DEVICE: auto
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGHOST: ${COMPOSE_PGHOST:-postgres}
      REDIS_HOST: ${COMPOSE_REDIS_HOST:-redis}
      SOKUDAN_URL: http://sokudan:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sokudan:
        condition: service_healthy

volumes:
  postgres_data:
